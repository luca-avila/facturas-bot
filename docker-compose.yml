services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: facturas
      POSTGRES_PASSWORD: facturas
      POSTGRES_DB: facturas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturas -d facturas"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
